<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Заглушка вместо фото для demo.html (шторка data-dk-curtain): свой рисунок, не снимок.
       На сайте на этом месте — настоящий кадр дела (media.mjs, лицензия в credits.json). -->
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.22" r="0.95">
      <stop offset="0" stop-color="#6a4328"/>
      <stop offset="0.5" stop-color="#3a261a"/>
      <stop offset="1" stop-color="#1b120d"/>
    </radialGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c5230"/>
      <stop offset="1" stop-color="#553519"/>
    </linearGradient>
    <linearGradient id="crust" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#d89a55"/>
      <stop offset="0.6" stop-color="#a9642c"/>
      <stop offset="1" stop-color="#7a431b"/>
    </linearGradient>
    <linearGradient id="crust2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2ad69"/>
      <stop offset="1" stop-color="#9c5a26"/>
    </linearGradient>
    <radialGradient id="shade" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- доска -->
  <rect x="80" y="548" width="1040" height="168" rx="28" fill="url(#board)"/>
  <path d="M120 590h720M160 632h460M700 664h360M140 684h280" stroke="#8d6139" stroke-width="4" stroke-linecap="round" opacity="0.55" fill="none"/>
  <ellipse cx="420" cy="560" rx="250" ry="22" fill="#2a1a10" opacity="0.45"/>
  <ellipse cx="870" cy="585" rx="230" ry="18" fill="#2a1a10" opacity="0.4"/>

  <!-- каравай -->
  <path d="M170 556c6-150 116-236 250-236s244 86 250 236z" fill="url(#crust)"/>
  <path d="M258 488c30-58 76-100 136-124M332 526c38-70 96-120 170-146M452 546c26-40 62-70 108-88" fill="none" stroke="#f0cf97" stroke-width="16" stroke-linecap="round" opacity="0.85"/>

  <!-- багет -->
  <g transform="rotate(-24 870 520)">
    <rect x="610" y="486" width="520" height="84" rx="42" fill="url(#crust2)"/>
    <path d="M668 540c26-20 54-30 86-32M766 540c26-20 54-30 86-32M864 540c26-20 54-30 86-32M962 540c26-20 54-30 86-32" fill="none" stroke="#f3d7a4" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- колос -->
  <g fill="none" stroke="#efdcb8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M1010 700c-30-60-52-120-60-196"/>
    <path d="M985 640c-22-6-34-22-34-44 20 6 32 22 34 44zM975 604c-22-6-34-22-34-44 20 6 32 22 34 44zM967 566c-20-6-31-21-31-41 18 5 29 20 31 41z"/>
    <path d="M985 640c16-14 34-18 52-12-12 16-30 20-52 12zM975 604c16-14 34-18 52-12-12 16-30 20-52 12zM967 566c15-13 32-17 48-11-11 15-28 19-48 11z"/>
    <path d="M951 504c-4-22 2-42 18-56 8 20 2 40-18 56z"/>
  </g>

  <!-- мука -->
  <g fill="#f7ecd8">
    <circle cx="300" cy="360" r="4" opacity="0.6"/><circle cx="352" cy="338" r="3" opacity="0.5"/><circle cx="418" cy="332" r="5" opacity="0.55"/>
    <circle cx="486" cy="350" r="3.5" opacity="0.5"/><circle cx="540" cy="384" r="4" opacity="0.45"/><circle cx="230" cy="600" r="5" opacity="0.4"/>
    <circle cx="640" cy="640" r="4" opacity="0.4"/><circle cx="690" cy="612" r="3" opacity="0.35"/><circle cx="1060" cy="630" r="4" opacity="0.35"/>
    <circle cx="160" cy="660" r="3" opacity="0.35"/><circle cx="560" cy="676" r="3.5" opacity="0.3"/>
  </g>

  <rect width="1200" height="800" fill="url(#shade)"/>
</svg>
