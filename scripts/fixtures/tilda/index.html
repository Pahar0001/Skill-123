<script>
  /* масштаб Zero Block при upscale=window — как у Tilda: zoom = ширина окна / брейкпоинт артборда (3 знака) */
  window.tn = {};
  for (const ab of document.querySelectorAll('.t396__artboard')) {
    const id = ab.getAttribute('data-artboard-recid');
    const screens = ab.getAttribute('data-artboard-screens').split(',').map(Number).sort((a, b) => a - b);
    let res = null; for (const s of screens) if (innerWidth >= s) res = s; if (res === null) res = screens[0];
    const win = ab.getAttribute('data-artboard-upscale') === 'window';
    const z = win ? parseFloat((innerWidth / res).toFixed(3)) : 1;
    window.tn['ab' + id] = { curResolution: res, scaleFactor: z };
    if (win) { ab.classList.add('t396__artboard_scale'); for (const el of ab.querySelectorAll('.t396__elem')) el.style.zoom = String(z); }
  }
</script>
