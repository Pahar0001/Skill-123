<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стенд runtime.mjs — без JavaScript заставка не уходит</title>
<link rel="icon" href="data:,">
<!--
  Стенд runtime.mjs --no-js (node runtime.mjs --selftest): заставка div#preloader (fixed на всё окно, сплошной фон) убирает
  скрипт после загрузки. Без JavaScript она остаётся и закрывает страницу (arunnm.com, 01.10: на снимке только «Loading 0%»,
  а runtime писал «OK без JS всё видно»). Без JavaScript — WARN «без JS страницу закрывает заставка div#preloader»; строки OK
  «без JS всё видно» нет. Сами блоки страницы видимы по своим стилям — закрывает их слой сверху (elementFromPoint).
-->
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #1b1b1b; background: #faf8f4; }
  main { max-width: 720px; margin: 0 auto; padding: 32px; }
  #preloader { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #111; color: #eee; font-size: 32px; }
  #preloader.done { display: none; }
</style>
</head>
<body>
<div id="preloader">Загрузка 0%</div>
<main>
  <h1>Ресторан «Берег»</h1>
  <p>Стейки на углях у реки.</p>
  <p>Банкетный зал на сорок гостей.</p>
  <p>Открыты каждый день с полудня.</p>
  <p>Бронь по телефону и на сайте.</p>
</main>
<script>
  window.addEventListener('load', () => document.getElementById('preloader').classList.add('done'));
</script>
</body>
</html>
