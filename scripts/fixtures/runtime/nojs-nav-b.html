<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стенд runtime.mjs — страница меню, куда ведёт ссылка с главной</title>
<link rel="icon" href="data:,">
<!--
  Стенд runtime.mjs --no-js (node runtime.mjs --selftest), пара к nojs-nav-a.html: страница меню. Весь текст виден и без
  JavaScript; бледная подложка «МЕНЮ ДНЯ» (opacity 0) скрыта и с JavaScript — декор по замыслу. Правильный итог после перехода
  и --scroll: «страница сменилась», OK «без JS всё видно», подложка — INFO «по замыслу», а не находка.
-->
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; color: #1b1b1b; background: #faf8f4; }
  main { max-width: 720px; margin: 0 auto; padding: 32px; }
  .ghost { font-size: 96px; line-height: 1; font-weight: 800; opacity: 0; margin: 0; }
  .tall { height: 900px; }
</style>
</head>
<body>
<main>
  <p class="ghost">МЕНЮ ДНЯ</p>
  <h1>Меню ресторана на неделю</h1>
  <p>Суп дня с домашним хлебом и зеленью.</p>
  <p>Стейк рибай на углях, соус на выбор.</p>
  <p>Сибас на гриле с овощами и лимоном.</p>
  <div class="tall"></div>
  <p>Десерт дня: медовик по семейному рецепту.</p>
</main>
<script>document.body.dataset.js = 'да';</script>
</body>
</html>
