<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стенд runtime.mjs — меню со сломанными якорями</title>
<link rel="icon" href="data:,">
<!--
  Стенд runtime.mjs --nav (node runtime.mjs --selftest): у разделов переименовали id, а меню не поправили —
  четыре якоря ведут в никуда. WARN «якоря меню ведут в никуда — 4» со списком (#about, #menu, #events,
  #contacts); «#top» не в счёт — браузер сам ведёт наверх. Раньше — INFO «якорей на разделы этой страницы 4
  (нужно от 3) — меню ведёт на другие страницы», вердикт OK. Многостраничное меню без якорей (menu.html) —
  по-прежнему INFO «якорей нет».
-->
<style>
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; }
  nav { position: sticky; top: 0; background: #fff; padding: 12px; display: flex; gap: 16px; }
  section { min-height: 900px; padding: 32px; border-top: 1px solid #ddd; }
</style>
</head>
<body>
<nav class="top">
  <a href="#top">Наверх</a>
  <a href="#about">О нас</a>
  <a href="#menu">Меню</a>
  <a href="#events">Афиша</a>
  <a href="#contacts">Контакты</a>
</nav>
<section id="o-nas"><h2>О нас</h2></section>
<section id="menyu"><h2>Меню</h2></section>
<section id="afisha"><h2>Афиша</h2></section>
<section id="kontakty"><h2>Контакты</h2></section>
</body>
</html>
