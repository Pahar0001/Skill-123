<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>h1 прямо в main, кнопка — в следующей секции</title>
<!-- Стенд typeset.mjs --selftest (третий круг 29.09, из стендов проверяющего): блока первого экрана нет (h1 прямо в
     main), кнопка — в секции за следующим заголовком: не кнопка первого экрана. Ожидания — в typeset.mjs (SELFTEST). -->
<style>
body { margin: 0; font: 16px/1.5 Georgia, serif; color: #111; background: #fff; }
main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 0; }
h1 { font-size: 48px; line-height: 1.1; margin: 0 0 16px; }
.lead { font-size: 20px; margin: 0 0 80px; }
h2 { font-size: 28px; line-height: 1.2; margin: 0 0 12px; }
.btn { display: inline-block; padding: 12px 20px; background: #c43; color: #fff; text-decoration: none; border-radius: 6px; }
</style>
</head>
<body>
<main>
  <h1 id="h1">Меню ресторана у Волги</h1>
  <p class="lead" id="lede">Готовим из рыбы Рыбинского водохранилища и овощей с фермы по соседству.</p>
  <section id="hot">
    <h2 id="h2hot">Горячие блюда</h2>
    <p>Уха по-рыбински, судак на углях, щучьи котлеты с пюре и томлёная говядина.</p>
    <a class="btn" id="order" href="#order">Заказать доставку</a>
  </section>
</main>
</body>
</html>
