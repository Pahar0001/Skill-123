<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стенд perf: сдвиг вёрстки</title>
<!-- Стенд perf.mjs --selftest (cls). Через 0.7 с после load скрипт вставляет над статьёй плашку акции высотой
     160 px (section.promo) — статья article.news и всё ниже уезжает вниз на 160 px. Раньше в выводе было
     только число CLS. Ждём: крупнейший сдвиг — «после load», источник article.news «вниз на 160 px».
     Заголовок статьи — в обычной вложенной разметке с отступами по 2 пробела (глубина 3–7, как у меню
     «Эпицентра»): пять узлов-отступов — 45 знаков до первого слова. Текст источника — «Новости Открыли
     запись…»: раньше отступы съедали предел в 60 знаков, и от него оставалось «Новости».
     Сервер стенда не сжимает, адрес локальный: «INFO Сжатие текста … локальный сервер без прокси». -->
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="top"><p class="brand">Новости школы</p></header>
<main id="top">
  <article class="news">
    <div class="news__wrap">
      <div class="news__card">
        <header class="news__head">
          <div class="news__title">
            <span class="news__kicker">Новости</span>
            <h1>Открыли запись на осенний сезон</h1>
          </div>
        </header>
      </div>
    </div>
    <p>Занятия начинаются в октябре. Группы для детей от пяти лет и для взрослых, которые впервые встают на коньки.</p>
    <p>Прокат коньков и защиты — на месте, заточка — в день занятия. Запись по телефону администратора.</p>
    <div class="filler"></div>
  </article>
</main>
<script>
/* плашка акции появляется после загрузки и толкает статью вниз — источник CLS */
addEventListener('load', () => setTimeout(() => {
  const b = document.createElement('section'); b.className = 'promo'; b.textContent = 'Скидка 20% на абонемент до конца недели';
  document.getElementById('top').prepend(b);
}, 700));
</script>
</body>
</html>
