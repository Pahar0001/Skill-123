<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стенд texture.mjs: картинка-подложка тегом img</title>
<!-- Стенд самопроверки texture.mjs (как dndbeyond.com): фон секции — не background, а картинка тегом img во весь блок.
     blobs.webp — бледная картинка из одних крупных мягких пятен (по файлу проходит как «крупная фактура»: так выглядит
     и приглушённая иллюстрация). Под текстом лежит именно она — на странице это не плитка, а подложка-иллюстрация:
     ждём «крупной фактуры нет» с причиной про картинку-подложку. Вторая секция — та же подложка тегом img, но с
     зернистой бумагой (grain-paper.webp: крупных пятен в ней нет) — её находим. Картинки рисует selftest. -->
<style>
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 Arial,sans-serif;color:#1d2a22;background:#fff}
  section{position:relative;padding:70px 60px;min-height:700px;overflow:hidden}
  section > img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  section > *{position:relative;z-index:1}
  .light{background-color:#f6f6f6}
  h2{margin:0 0 18px;font-size:34px}
</style>
</head>
<body>
  <section id="blobs"><img class="bg" src="{{IMG}}" alt=""><h2>Подложка тегом img</h2></section>
  <section class="light"><h2>Ровная светлая секция</h2></section>
  <section class="light"><h2>Ещё ровная секция</h2></section>
</body>
</html>
