<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стенд lib: настоящий текст в разметке декора</title>
<!--
  Стенд findOverflow (fixtures/lib/selftest.mjs, случай overflow), экран 320 (mobile-s). Скептик 30.09: правило «декор —
  aria-hidden и role=presentation» глушило настоящий текст. Здесь текст, который глазами виден, — находка:
    h1#split      заголовок, разбитый на слова для анимации (так размечает GSAP SplitText 3.13+ по умолчанию: aria-label
                  с текстом у заголовка, aria-hidden у слов); «Достопримечательности» кеглем 64 шире экрана (body
                  overflow-x: clip) — FAIL «за краем экрана» span.w;
    h2#splitCard  то же в карточке 200 px с overflow:hidden, nowrap — WARN «текст обрезан»;
    .mark         надпись-логотип: слоги под aria-hidden, рядом sr-only копия «Эпицентр» для читалки; коробка 100 px с
                  overflow:hidden режет слог «цен» — WARN «текст обрезан»; ?srlabel=0 — без копии для читалки: декор,
                  молчит (контроль);
    nav li a      меню по образцу WAI-ARIA (ul role=menubar, li role=none, a role=menuitem): пункт 110 px с
                  overflow:hidden и nowrap режет «Корпоративные праздники» — WARN «текст обрезан» (роль у пункта списка
                  — не декор).
  Контроль — декор молчит:
    .promo .bg    бледное слово-фон «меню» (aria-hidden у слоя) в карточке «Основное меню» с overflow:hidden — подпись
                  рядом о том же, но это не копия для читалки;
    section[aria-label=Бар] .bg — слово-фон «БАР» в разделе с подписью «Бар»: подпись раздела ≠ его текст.
    Оба слова — блоки в потоке шире коробки внутри overflow:hidden (как .shout у coffee): без aria-hidden — находка.
  ?plain=1  — заголовки без разбиения (контроль: те же находки, что с разбиением);
  ?nohide=1 — у слов-фона снят aria-hidden: «текст обрезан» «меню» и «БАР» (контроль: проверка на них жива).
-->
<style>
  body { margin: 0; overflow-x: clip; font: 16px/1.4 Arial, sans-serif; color: #222; }
  main { padding: 16px; }
  h1 { font: 900 64px/1 Arial, sans-serif; margin: 0 0 16px; }
  .w { display: inline-block; }
  .card { overflow: hidden; width: 200px; border: 1px solid #ccc; padding: 8px; margin-bottom: 16px; }
  .card h2 { font: 700 34px/1.1 Arial, sans-serif; white-space: nowrap; margin: 0; }
  .mark { display: block; width: 100px; overflow: hidden; white-space: nowrap; font: 900 28px/1 Arial, sans-serif; margin-bottom: 16px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  nav ul { display: flex; gap: 8px; margin: 0 0 16px; padding: 0; list-style: none; }
  nav li { display: block; width: 110px; overflow: hidden; white-space: nowrap; border: 1px solid #ccc; padding: 6px; }
  nav a { color: #222; text-decoration: none; }
  .promo { display: block; position: relative; overflow: hidden; width: 260px; height: 200px; background: #1d2b3a; color: #fff; padding: 16px; box-sizing: border-box; margin-bottom: 16px; text-decoration: none; }
  .promo .bg, .bar .bg { display: block; margin: -10px 0 -60px 40px; font: 900 150px/1 Arial, sans-serif; white-space: nowrap; color: rgba(255, 255, 255, .06); }
  .bar { position: relative; overflow: hidden; height: 200px; background: #f4efe6; padding: 16px; }
  .bar .bg { color: rgba(0, 0, 0, .05); }
</style>
</head>
<body>
<main>
  <h1 id="split"></h1>
  <div class="card"><h2 id="splitCard"></h2></div>
  <span class="mark"><span aria-hidden="true"><span>Эпи</span><span>цен</span><span>тр</span></span><span class="sr">Эпицентр</span></span>
  <nav aria-label="Главное меню">
    <ul role="menubar">
      <li role="none"><a role="menuitem" href="#a">Меню</a></li>
      <li role="none"><a role="menuitem" href="#b">Корпоративные праздники</a></li>
    </ul>
  </nav>
  <a class="promo" href="#menu"><span aria-hidden="true"><span class="bg">меню</span></span><h3>Основное<br>меню</h3></a>
  <section class="bar" aria-label="Бар"><span class="bg" aria-hidden="true">БАР</span><h3>Барная карта</h3><p>Коктейли и настойки.</p></section>
  <p>Обычный текст раздела.</p>
</main>
<script>
  const plain = /plain=1/.test(location.search);
  if (/srlabel=0/.test(location.search)) document.querySelector('.mark .sr').remove();
  if (/nohide=1/.test(location.search)) for (const e of document.querySelectorAll('.promo [aria-hidden], .bar [aria-hidden]')) e.removeAttribute('aria-hidden');
  const put = (el, text) => {
    if (plain) { el.textContent = text; return; }
    el.setAttribute('aria-label', text);
    el.innerHTML = text.split(' ').map((w) => `<span class="w" aria-hidden="true">${w}</span>`).join(' ');
  };
  put(document.getElementById('split'), 'Достопримечательности Рыбинска');
  put(document.getElementById('splitCard'), 'Бронирование столов');
</script>
</body>
</html>
