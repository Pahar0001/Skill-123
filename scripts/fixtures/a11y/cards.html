<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стенд a11y: подписи над фото и градиентами</title>
<!-- Стенд a11y.mjs --selftest (cards). Десять карточек «фото и подпись поверх» одного класса и цвета: кадры 1–3
     тёмные, 4–10 светлые — белая подпись и строка времени над ними не читаются. Семь плиток с градиентом:
     1–3 тёмные, 4–7 светлые. Раньше мерились не больше трёх элементов на подпись «класс|цвет|класс картинки» —
     первые три тёмные, вердикт OK. Карточки 7–10 — один и тот же кадр (повтор того же фона): больше трёх
     одинаковых не мерятся — у 10-й подпись и строка времени пропускаются (повтор 2). Ждём: FAIL, измерено
     25 из 27, ниже нормы 16 (карточки 4–9 по два текста и плитки 4–7). -->

<style>
body { margin: 0; background: #fff; color: #222; font: 16px/1.5 system-ui, sans-serif; }
main { max-width: 960px; margin: 0 auto; padding: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin: 0 0 32px; padding: 0; list-style: none; }
.card { position: relative; height: 200px; overflow: hidden; border-radius: 12px; }
.card__img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card__body { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px; }
.card__title { margin: 0; font-size: 20px; font-weight: 400; color: #fff; }
.card__meta { font-size: 14px; color: #fff; }
.tile { height: 120px; padding: 16px; border-radius: 12px; }
.tile__t { margin: 0; font-size: 16px; color: #fff; }
.t1 { background-image: linear-gradient(135deg, #111, #333); }
.t2 { background-image: linear-gradient(135deg, #1b1b2f, #2e2e4a); }
.t3 { background-image: linear-gradient(135deg, #0f2a1d, #234d36); }
.t4 { background-image: linear-gradient(135deg, #f5f5f5, #dddddd); }
.t5 { background-image: linear-gradient(135deg, #fff4d6, #ffe7a8); }
.t6 { background-image: linear-gradient(135deg, #e8f0f8, #cfe0f2); }
.t7 { background-image: linear-gradient(135deg, #f9e3ec, #f3c7d8); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<main>
  <h1>Афиша</h1>
  <h2>Вечера</h2>
  <ul class="grid" id="cards"></ul>
  <h2>Разделы</h2>
  <div class="grid">
    <div class="tile t1"><p class="tile__t">Завтраки</p></div>
    <div class="tile t2"><p class="tile__t">Обеды</p></div>
    <div class="tile t3"><p class="tile__t">Ужины</p></div>
    <div class="tile t4"><p class="tile__t">Десерты</p></div>
    <div class="tile t5"><p class="tile__t">Напитки</p></div>
    <div class="tile t6"><p class="tile__t">Бар</p></div>
    <div class="tile t7"><p class="tile__t">С собой</p></div>
  </div>
</main>
<script>
/* кадры — однотонные SVG: 1–3 тёмные, 4–10 светлые, 8–10 — тот же кадр, что у 7-й */
const fills = ['#1d1d1d', '#2a2230', '#1f2a24', '#f4efe6', '#e8f0f8', '#fff4d6', '#eaeaea', '#eaeaea', '#eaeaea', '#eaeaea'];
const names = ['Джаз', 'Кино', 'Лекция', 'Квиз', 'Дегустация', 'Мастер-класс', 'Стендап', 'Стендап 2', 'Стендап 3', 'Стендап 4'];
const ul = document.getElementById('cards');
fills.forEach((f, i) => {
  const src = 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="400" height="300" fill="${f}"/></svg>`);
  const li = document.createElement('li'); li.className = 'card';
  li.innerHTML = `<img class="card__img" src="${src}" alt=""><div class="card__body"><h3 class="card__title">${names[i]}</h3><span class="card__meta">пятница, 19:00</span></div>`;
  ul.appendChild(li);
});
</script>
</body>
</html>
